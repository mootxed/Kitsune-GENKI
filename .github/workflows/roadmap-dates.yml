name: Auto Roadmap Dates

on:
  issues:
    types: [opened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Target issue number for manual roadmap date update'
        required: true
        type: string

permissions:
  issues: write

jobs:
  set-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Update Issue and Roadmap Dates
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            let issue = context.payload.issue;
            let action = context.payload.action || 'opened';
            const issueNumberInput = process.env.ISSUE_NUMBER;

            if (context.eventName === 'workflow_dispatch' || (!issue && issueNumberInput)) {
              if (!issueNumberInput || !issueNumberInput.trim()) {
                throw new Error('Issue number input is required for manual workflow dispatch.');
              }
              const issueNum = parseInt(issueNumberInput.trim(), 10);
              if (isNaN(issueNum) || issueNum <= 0) {
                throw new Error(`Invalid issue number provided: "${issueNumberInput}"`);
              }
              try {
                const fetched = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNum,
                });
                issue = fetched.data;
              } catch (err) {
                throw new Error(`Failed to fetch issue #${issueNum}: ${err.message}`);
              }
            }

            if (!issue) {
              throw new Error('No valid issue provided for roadmap date update.');
            }

            const today = new Date().toISOString().split('T')[0];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;

            let body = issue.body || '';
            let bodyChanged = false;

            if (action === 'opened') {
              if (!body.includes('**Start Date:**')) {
                body += `\n\n---\n**Start Date:** ${today}`;
                bodyChanged = true;
              }
            } else if (action === 'closed') {
              if (!body.includes('**End Date:**')) {
                body += `\n**End Date:** ${today}`;
                bodyChanged = true;
              } else {
                body = body.replace(/\*\*End Date:\*\*.*/, `**End Date:** ${today}`);
                bodyChanged = true;
              }
            }

            if (bodyChanged) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                body: body,
              });
              console.log(`Updated issue #${issueNumber} description with timeline date.`);
            }

            const commentBody = action === 'opened'
              ? `📅 **Roadmap Date Updated**: Issue opened on ${today}. Start Date set to **${today}**.`
              : `📅 **Roadmap Date Updated**: Issue closed on ${today}. End Date set to **${today}**.`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: commentBody,
            });
            console.log(`Posted roadmap date comment on issue #${issueNumber}.`);
