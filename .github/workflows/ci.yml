name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint: includes public/sw.js via dedicated ESLint override (sourceType:script)
      - name: Run linter (including Service Worker)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Unit tests: includes sw-helpers.test.js and a11y-helpers.test.js
      - name: Run unit tests (SW helpers + accessibility helpers)
        run: npm test

      # Production build: required before E2E so SW hash is injected
      - name: Build project (production)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # E2E runs on production build to test real SW behavior
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build production bundle (with auto cache versioning via vite.config.js plugin)
      - name: Build production bundle (with SW hash injection)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Run E2E on dev server (which serves production-like content)
      # accessibility.spec.js includes axe-core checks and keyboard navigation tests
      - name: Run E2E tests (accessibility + keyboard + offline PWA)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
