name: CI & CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (including Service Worker)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check legal metadata & compliance
        run: npm run legal:check

      - name: Check documentation
        run: npm run docs:check

      - name: Dependency security audit
        run: npm run security:audit

      - name: Check dangerous DOM and URL usage
        run: npm run security:check

      - name: Verify migration fixtures integrity
        run: npm run fixtures:verify

  coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with mandatory coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Production Build & Manifest
    runs-on: ubuntu-latest
    needs: [quality, coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_BASE: /KotoKitsu/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotokitsu-dist-${{ github.sha }}
          path: dist/
          retention-days: 1

      - name: Upload sourcemaps artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotokitsu-sourcemaps-${{ github.sha }}
          path: .sourcemaps/
          retention-days: 7

  e2e:
    name: End-to-End & Cross-Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download verified dist artifact
        uses: actions/download-artifact@v4
        with:
          name: kotokitsu-dist-${{ github.sha }}
          path: dist/

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium Full E2E suite
        run: npm run test:e2e:chromium
        env:
          CI: true

      - name: Run Cross-browser Smoke suite (Chromium, Firefox, WebKit)
        run: npm run test:e2e:cross-browser
        env:
          CI: true

      - name: Run PWA & Storage Resilience suites
        run: |
          npm run test:e2e:pwa
          npm run test:e2e:offline
          npm run test:e2e:storage
          npm run test:e2e:multitab
        env:
          CI: true

      - name: Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified dist artifact
        uses: actions/download-artifact@v4
        with:
          name: kotokitsu-dist-${{ github.sha }}
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
