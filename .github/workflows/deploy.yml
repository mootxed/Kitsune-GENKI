name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Check legal metadata & compliance
        run: npm run legal:check

      - name: Build project for E2E
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Print E2E environment diagnostics
        run: |
          echo "VITE_BASE: ${VITE_BASE:-(default /)}"
          echo "dist/index.html script/link tags:"
          grep -E '<(script|link)' dist/index.html || true
          echo "Playwright baseURL: http://127.0.0.1:3000/"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Build project for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /KotoKitsu/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
