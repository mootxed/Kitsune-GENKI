version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
    groups:
      patch-and-minor:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions-patch-and-minor:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
